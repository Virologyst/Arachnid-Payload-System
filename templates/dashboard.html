<!DOCTYPE html>


<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>EGH455 Dashboard</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">

        <script>
        document.addEventListener("DOMContentLoaded", function() {
            const updateBtn = document.getElementById("updateBtn");
            updateBtn.addEventListener("click", function() {
                // Show loading spinner
                document.getElementById("loading").style.display = "block";

                // Disable the button to prevent double clicks
                updateBtn.disabled = true;

                fetch("/update", { method: "POST" })
                    .then(() => {
                        // Wait for the Pi to restart the service
                        setTimeout(() => {
                            window.location.reload();
                        }, 5000); // 5s
                    });
                });
            });
        </script>

            <script>
        document.addEventListener("DOMContentLoaded", function() {
            const panel = document.getElementById("dynamicPanel");

            function loadPanel(view) {
                fetch(`/panel/${view}`)
                    .then(r => r.text())
                    .then(html => {
                        panel.innerHTML = html;
                    });
            }

            // Attach listeners for each tab
            document.getElementById("btnSensors").addEventListener("click", () => loadPanel('sensors'));
            document.getElementById("btnLogs").addEventListener("click", () => loadPanel('logs'));
            document.getElementById("btnTargets").addEventListener("click", () => loadPanel('targets'));
            document.getElementById("btnSystem").addEventListener("click", () => loadPanel('system'));

            // Load default view on page load
            loadPanel('sensors');
        });
        </script>

</head>

<body>
    <header>
        <h1>EGH455 - Team 5</h1>
    </header>
    <main>
        <div class="sidebar">
            <img src="/static/thumb1.jpg" alt="Thumbnail 1">
            <img src="/static/thumb1.jpg" alt="Thumbnail 2">
            <img src="/static/thumb1.jpg" alt="Thumbnail 3">
            <img src="/static/thumb1.jpg" alt="Thumbnail 1">
            <img src="/static/thumb1.jpg" alt="Thumbnail 2">
            <img src="/static/thumb1.jpg" alt="Thumbnail 3">
            <img src="/static/thumb1.jpg" alt="Thumbnail 1">
            <img src="/static/thumb1.jpg" alt="Thumbnail 2">
            <img src="/static/thumb1.jpg" alt="Thumbnail 3">
        </div>
        <div class="content">
            <div class="top-row">

                  <!-- LEFT SIDE: Camera -->
                <div class="camera-pane">
                    <!-- Placeholder: replace with RTSP/MJPEG later -->
                    <img src="/static/mars.jpg" alt="Live Camera Feed">
                </div>

                <!-- RIGHT SIDE: Dynamic Panel -->
                <div class="panel-pane">
                    <div class="tab-buttons">
                        <button id="btnSensors">📊 Sensors</button>
                        <button id="btnLogs">📜 Logs</button>
                        <button id="btnTargets">🎯 Targets</button>
                        <button id="btnSystem">⚙ System</button>
                    </div>
                    <div id="dynamicPanel">
                        <!-- Content loads here dynamically -->
                    </div>
                </div>
            </div>
            <div class="bottom-row">
                <div class="readings-table">
                    <table border="1" cellpadding="5">
                        <tr><th>Targets</th><th>Average Readings</th></tr>
                        <tr><td>A:</td><td>- - -</td></tr>
                        <tr><td>B:</td><td>380 ppm, 22.3°C, 14%</td></tr>
                        <tr><td>C:</td><td>- - -</td></tr>
                    </table>
                </div>
                <div class="status-bars">
                    <div>
                        <div class="bar"><div class="bar-fill" style="height: 60%;"></div></div>
                        <div class="bar-label">CO₂</div>
                    </div>
                    <div>
                        <div class="bar"><div class="bar-fill" style="height: 45%;"></div></div>
                        <div class="bar-label">Temp</div>
                    </div>
                    <div>
                        <div class="bar"><div class="bar-fill" style="height: 30%;"></div></div>
                        <div class="bar-label">Humid</div>
                    </div>
                </div>
            </div>

            <button id="updateBtn" style="background: #4CAF50; color: white; padding: 10px; border: none; cursor: pointer;">
                🔄 Update & Restart
            </button>

            <div id="loading" style="display:none; margin-top: 10px;">
                <img src="/static/loading.gif" alt="Loading..." style="width: 50px;">
                <p>Updating... please wait</p>
            </div>

<!--            <form action="/restart" method="POST" style="display:inline; margin-left:10px;">-->
<!--                <button type="submit" style="background: #f44336; color: white; padding: 10px; border: none; cursor: pointer;">-->
<!--                    Restart RasPi-->
<!--                </button>-->
<!--            </form>-->

        </div>
    </main>
</body>
</html>
