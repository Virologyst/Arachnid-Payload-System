stages:
  default_stage:
    input_model: models/model.onnx
    inputs:
      - name: images
        shape: [1, 3, 416, 416]
        layout: NCHW
        data_type: float32
        #mean_values: [0.0, 0.0, 0.0]
        #scale_values: [0.0039215686, 0.0039215686, 0.0039215686]
        calibration: false
    outputs:
      - name: output0
    encoding:
      from: RGB
      to: BGR
    keep_intermediate_outputs: true

